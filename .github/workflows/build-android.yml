name: Build Minimal Android AAR

on:
  workflow_dispatch:
    inputs:
      include_arm_v7a:
        description: 'Build cả arm-v7a-neon (32-bit cũ) ngoài arm64-v8a?'
        type: boolean
        default: false

  push:
    paths:
      - 'scripts/android/**'
      - 'android.sh'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Ultra-Minimal AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            yasm \
            nasm \
            pkg-config \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            curl

      - name: Set up Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Make scripts executable
        run: |
          chmod +x android.sh
          chmod -R +x scripts/

      - name: Run Android Build Script
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "Using Android NDK at: ${ANDROID_NDK_ROOT}"
          
          # Cấu hình cờ kiến trúc
          ARCH_FLAGS="--disable-x86 --disable-x86-64"
          if [ "${{ github.event.inputs.include_arm_v7a }}" != "true" ]; then
            ARCH_FLAGS="${ARCH_FLAGS} --disable-arm-v7a --disable-arm-v7a-neon"
          else
            ARCH_FLAGS="${ARCH_FLAGS} --disable-arm-v7a"
          fi

          ./android.sh \
            --enable-x264 \
            --enable-gpl \
            --enable-android-media-codec \
            --api-level=24 \
            ${ARCH_FLAGS}

      - name: Find and list generated AAR files
        run: |
          echo "=== Generated AAR files ==="
          find . -name "*.aar" -ls

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-minimal-aar
          path: |
            prebuilt/bundle-android-aar/*.aar
            android/ffmpeg-kit-android-lib/build/outputs/aar/*.aar
          if-no-files-found: error
