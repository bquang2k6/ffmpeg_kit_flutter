name: Build Minimal Android AAR

on:
  workflow_dispatch:
    inputs:
      arch_preset:
        description: 'Kiến trúc CPU cần build vào AAR:'
        type: choice
        options:
          - 'universal-arm' # arm64-v8a + armeabi-v7a (Chạy 100% điện thoại thật, ~6-7MB)
          - 'arm64-only'    # Chỉ arm64-v8a (Siêu nhẹ ~3MB, thiết bị đời mới)
          - 'all'           # Cả điện thoại thật lẫn máy ảo PC (arm64, armv7, x86, x86_64)
        default: 'universal-arm'

  push:
    paths:
      - 'scripts/android/**'
      - 'android.sh'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Ultra-Minimal AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            yasm \
            nasm \
            pkg-config \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            curl

      - name: Set up Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Make scripts executable
        run: |
          chmod +x android.sh
          chmod -R +x scripts/

      - name: Configure Architectures and Run Build
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          PRESET: ${{ github.event.inputs.arch_preset || 'universal-arm' }}
        run: |
          echo "Using Android NDK at: ${ANDROID_NDK_ROOT}"
          echo "Selected architecture preset: ${PRESET}"

          case "${PRESET}" in
            "arm64-only")
              ARCH_FLAGS="--disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64"
              ;;
            "universal-arm")
              # Đóng gói cả 64-bit và 32-bit (chạy trên 100% thiết bị Android thực tế)
              # Bỏ x86/x86_64 máy ảo và arm-v7a non-neon cũ
              ARCH_FLAGS="--disable-arm-v7a --disable-x86 --disable-x86-64"
              ;;
            "all")
              ARCH_FLAGS=""
              ;;
            *)
              ARCH_FLAGS="--disable-arm-v7a --disable-x86 --disable-x86-64"
              ;;
          esac

          ./android.sh \
            --enable-x264 \
            --enable-gpl \
            --enable-android-media-codec \
            --api-level=24 \
            ${ARCH_FLAGS}

      - name: Find and list generated AAR files
        run: |
          echo "=== Generated AAR files ==="
          find . -name "*.aar" -ls

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-minimal-aar
          path: |
            prebuilt/bundle-android-aar/*.aar
            android/ffmpeg-kit-android-lib/build/outputs/aar/*.aar
          if-no-files-found: error
